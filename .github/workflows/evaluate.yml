name: Valutazione modelli

# Esegue la validazione walk-forward sui dati reali e posta il report come commento
# sulla pull request (così si vede l'effetto di ogni modifica ai modelli prima del merge).
# Non usa secret: scarica solo i CSV pubblici di football-data.co.uk. Non pubblica nulla.

on:
  pull_request:
    paths:
      - "schedina_ai/**"
      - ".github/workflows/evaluate.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-job.txt

      - run: pip install -r requirements-job.txt

      - name: Validazione walk-forward
        run: python -m schedina_ai evaluate --report report.md

      - name: Riepilogo del job
        run: cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commento sulla PR
        if: github.event_name == 'pull_request'
        continue-on-error: true   # le PR da fork non hanno permessi di scrittura
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "_Commit ${GITHUB_SHA::7} — valutazione automatica sui dati reali_"; echo; cat report.md; } > comment.md
          gh api "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" -F body=@comment.md >/dev/null
